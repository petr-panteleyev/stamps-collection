openapi: "3.0.0"

info:
  title: Теги
  version: 1.0.0

paths:
  /api/v1/tags:
    get:
      tags:
        - "tags, v1"
      summary: 'Получить список всех тегов'
      operationId: getTags
      responses:
        "200":
          description: 'Success'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagDTO'

    post:
      tags:
        - "tags, v1"
      summary: 'Создать тег'
      operationId: postTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDTO'
      responses:
        "200":
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        "400":
          description: 'Bad Request'
          content:
            application/json:
              schema:
                $ref: './objects.yml#/components/schemas/ErrorDTO'
        "409":
          description: 'Conflict'
          content:
            application/json:
              schema:
                $ref: './objects.yml#/components/schemas/ErrorDTO'

  /api/v1/tags/{id}:
    get:
      tags:
        - "tags, v1"
      summary: 'Получить тег по идентификатору'
      operationId: getTagById
      parameters:
        - name: id
          description: 'Идентификатор тега'
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        "404":
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: './objects.yml#/components/schemas/ErrorDTO'

    put:
      tags:
        - "tags, v1"
      summary: 'Обновить тег'
      operationId: putTag
      parameters:
        - name: id
          description: 'Идентификатор тега'
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDTO'
      responses:
        "200":
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'


components:
  schemas:

    TagDTO:
      type: object
      description: 'Тег для элементов коллекции'
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
          description: 'Идентификатор тега'
        name:
          type: string
          description: 'Уникальное название тега'
