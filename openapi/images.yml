openapi: "3.0.0"

info:
  title: 'Изображения для марок, блоков и сцепок'
  version: 1.0.0

paths:
  /api/v1/images/{id}:
    put:
      tags:
        - "images, v1"
      summary: 'Обновить изображение'
      operationId: putImage
      parameters:
        - name: id
          description: 'Идентификатор изображения'
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadDTO'
      responses:
        "200":
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponseDto'

  /api/v1/images/{id}/binary:
    get:
      tags:
        - "images, v1"
      summary: 'Получить байты изображения'
      operationId: getImageBytes
      parameters:
        - name: id
          description: 'Идентификатор изображения'
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Success'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary

components:
  schemas:

    ImageUploadDTO:
      type: object
      description: 'Запрос на обновление изображения'
      required:
        - image
      properties:
        image:
          type: string
          description: 'Байты изображения в Base64'
          nullable: false

    ImageUploadResponseDto:
      type: object
      description: 'Ответ на запрос на обновление изображения'
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: 'Идентификатор изображения'
